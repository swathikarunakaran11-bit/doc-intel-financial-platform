version: '3.8'

services:
  doc-intel-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: doc-intel-platform
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./doc_intelligence.db:/app/doc_intelligence.db
    environment:
      - DATABASE_URL=sqlite:///doc_intelligence.db
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
